<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>申论规范词 · 听写409＋广东65</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --primary:#0f766e; --primary-soft:#ccfbf1;
  --ok:#16a34a; --ok-bg:#f0fdf4; --near:#d97706; --near-bg:#fffbeb; --bad:#dc2626; --bad-bg:#fef2f2;
  --chip:#e2e8f0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --card:#151e31; --text:#e2e8f0; --sub:#94a3b8; --line:#24304a;
    --primary:#2dd4bf; --primary-soft:#134e4a;
    --ok:#4ade80; --ok-bg:#052e16; --near:#fbbf24; --near-bg:#451a03; --bad:#f87171; --bad-bg:#450a0a;
    --chip:#24304a;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6;}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px;}
header h1{font-size:19px;margin:0;letter-spacing:.5px;}
header .sub{font-size:12px;color:var(--sub);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.06);}
.btn{display:block;width:100%;min-height:52px;border:none;border-radius:14px;font-size:17px;font-weight:600;padding:12px 16px;margin:10px 0;cursor:pointer;background:var(--chip);color:var(--text);transition:transform .05s;}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--primary);color:#fff;}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub);font-weight:500;font-size:15px;min-height:44px;}
.btn.small{display:inline-block;width:auto;min-height:40px;font-size:14px;padding:8px 14px;margin:4px 6px 4px 0;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:default;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.row .btn{flex:1;margin:6px 0;}
.screen{display:none;}
.screen.active{display:block;}
.bigchoice{min-height:96px;font-size:20px;border-radius:18px;text-align:left;padding:18px 20px;}
.gdchoice{background:var(--primary-soft);}
.bigchoice .desc{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:4px;}
.stats{display:flex;gap:10px;margin:6px 0 2px;}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;}
.stat b{display:block;font-size:22px;}
.stat span{font-size:12px;color:var(--sub);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.chip{border:none;background:var(--chip);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;}
.chip.on{background:var(--primary);color:#fff;}
.search{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:10px 14px;font-size:16px;margin:6px 0 12px;}
.pv-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.pv-item .w{font-size:17px;font-weight:700;}
.pv-item .d{font-size:14px;color:var(--sub);margin-top:6px;}
.pv-item .meta{font-size:11px;color:var(--sub);margin-top:8px;display:flex;justify-content:space-between;align-items:center;}
.badge{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:600;}
.badge.correct{background:var(--ok-bg);color:var(--ok);}
.badge.near{background:var(--near-bg);color:var(--near);}
.badge.wrong,.badge.revealed,.badge.skip{background:var(--bad-bg);color:var(--bad);}
.badge.none{background:var(--chip);color:var(--sub);}
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:4px 0 10px;}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s;}
.d-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:8px;}
.d-def{font-size:17px;line-height:1.9;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;}
.hintline{margin:12px 0 0;font-size:20px;font-weight:700;letter-spacing:6px;color:var(--primary);min-height:0;}
.hintnote{font-size:12px;color:var(--sub);letter-spacing:0;font-weight:400;margin-left:8px;}
input.answer{width:100%;min-height:54px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:12px 16px;font-size:19px;margin:14px 0 4px;}
input.answer:focus{outline:none;border-color:var(--primary);}
.feedback{border-radius:14px;padding:14px 16px;margin:12px 0;font-size:15px;display:none;}
.feedback.show{display:block;}
.feedback.correct{background:var(--ok-bg);border:1.5px solid var(--ok);}
.feedback.near{background:var(--near-bg);border:1.5px solid var(--near);}
.feedback.wrong,.feedback.revealed,.feedback.skip{background:var(--bad-bg);border:1.5px solid var(--bad);}
.feedback .verdict{font-size:18px;font-weight:800;margin-bottom:6px;}
.feedback.correct .verdict{color:var(--ok);}
.feedback.near .verdict{color:var(--near);}
.feedback.wrong .verdict,.feedback.revealed .verdict,.feedback.skip .verdict{color:var(--bad);}
.feedback .std{font-size:18px;font-weight:700;margin:6px 0;}
.feedback .yours{font-size:14px;color:var(--sub);word-break:break-all;}
.feedback .diffnote{font-size:13px;color:var(--sub);margin-top:6px;}
.ch-ok{color:var(--ok);}
.ch-no{color:var(--bad);text-decoration:underline;font-weight:800;}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.toolbar .btn{flex:1 1 40%;margin:0;min-height:44px;font-size:14px;}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center;z-index:99;}
.toast.show{opacity:.95;}
.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:14px;}
.done-big{font-size:44px;font-weight:800;text-align:center;margin:8px 0;}
.done-sub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:14px;}
.linkbtn{background:none;border:none;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer;padding:8px;}
.note{font-size:12px;color:var(--sub);margin-top:8px;}
</style>
</head>

"use strict";
var DATA = [{"id":1,"bank":"词条（269页起）","word":"促进再就业","def":"老厂关停并转，不少四五十岁的工人丢了饭碗。当地办起专场招聘会、免费技能培训班，帮这批人重新找到了工作。"},{"id":2,"bank":"词条（269页起）","word":"带动村民就业","def":"龙头企业把加工车间建到村口，上百名原本外出打工的人留在村里拿工资，还能兼顾老人孩子。"},{"id":3,"bank":"词条（269页起）","word":"提供就业岗位","def":"产业园引进二十多家企业，新产线投产后首批放出三千多个用工名额，普工、技工、管理岗都有。"},{"id":4,"bank":"词条（269页起）","word":"就地就业","def":"县里把帮扶车间建在安置社区，原本要去沿海打工的姐妹下楼走五分钟就能上班，收入不比外面少。"},{"id":5,"bank":"词条（269页起）","word":"加强保密技能学习","def":"某机关定期组织干部学习加密设备操作、涉密载体管理，请专家演示钓鱼邮件识别，人人过关、年年复训。"},{"id":6,"bank":"词条（269页起）","word":"增强认同感","def":"社区把议事厅搬到老槐树下，大事小情居民一起商量。大家说：'这地方终于像自己家了。'"},{"id":7,"bank":"词条（269页起）","word":"提升自豪感","def":"村里竹编非遗在省文博会亮相，老匠人站在展柜前腰板挺直，孩子们也觉得家乡了不起。"},{"id":8,"bank":"词条（269页起）","word":"转变发展理念","def":"县委书记在会上算账：'不能再只盯GDP，那几家污染企业贡献了税收，却毁了绿水青山。'此后全县否掉多个高耗能项目。"},{"id":9,"bank":"词条（269页起）","word":"发动群众举报","def":"市里开通热线和微信随手拍，查实线索给奖励。大爷大妈拍下违建和排污，线索源源不断汇到执法部门。"},{"id":10,"bank":"词条（269页起）","word":"重视职业技术培训","def":"县里把钱投给职业中学，实训设备对标企业产线，学生没毕业就被预订一空。校长说：'教真本事比什么都强。'"},{"id":11,"bank":"词条（269页起）","word":"改造传统工业","def":"老钢厂装上传感器和工业机器人，轧钢车间从上百人减到十几人，能耗降三成，老炉子焕发第二春。"},{"id":12,"bank":"词条（269页起）","word":"二三产业分离","def":"某农业县把加工车间从种植基地剥离，单独成立公司。种植归种植、加工归加工，各算各的账、各精各的专业。"},{"id":13,"bank":"词条（269页起）","word":"打破身份限制","def":"某市事业单位招聘不再问干部还是工人、编制内还是编制外，符合岗位条件就同场考试、同台竞争。"},{"id":14,"bank":"词条（269页起）","word":"增强工人归属感","def":"厂里建了职工公寓、办集体生日、提案有回音，老员工说：'厂子拿我们当家人，哪舍得走。'"},{"id":15,"bank":"词条（269页起）","word":"提高待遇水平和社会地位","def":"市里给环卫工人涨了三成工资，设立'城市美容师节'，请劳模坐主席台，报纸常登他们的故事。"},{"id":16,"bank":"词条（269页起）","word":"发展新业态","def":"老商业街冒出剧本杀馆、宠物咖啡、直播工作室，几年前没有的新样式如今贡献了半条街的营收。"},{"id":17,"bank":"词条（269页起）","word":"动员群众","def":"老旧小区改造前，干部挨家挨户讲政策、算收益，开院落会，居民从站着看到挽起袖子一起干。"},{"id":18,"bank":"词条（269页起）","word":"促进社会和谐","def":"街道建起调解室，邻里纠纷坐下来喝杯茶，调解员讲法讲理讲情，一年没有一起矛盾升级到派出所。"},{"id":19,"bank":"词条（269页起）","word":"消除负面影响","def":"事件上了热搜，当地24小时内开发布会公布调查结果，请媒体监督整改，舆论从质疑慢慢转向认可。"},{"id":20,"bank":"词条（269页起）","word":"加强综合治理","def":"校门口乱象由街道牵头，公安、城管、市场监管、社区一起上，管摊贩、巡治安、疏交通，一套组合拳。"},{"id":21,"bank":"词条（269页起）","word":"形成良好社会氛围","def":"公交车上让座、社区里互助、街头随手捡垃圾，做好事在这座城市成了常态，陌生人见面也带笑。"},{"id":22,"bank":"词条（269页起）","word":"加大宣传","def":"社区拉横幅、发手册、大喇叭广播、微信群推短视频，反诈知识进了千家万户。"},{"id":23,"bank":"词条（269页起）","word":"量身定制","def":"帮扶干部没照搬别人的方案，针对老张家有病人、离不开人的情况，专门设计了庭院养殖项目。"},{"id":24,"bank":"词条（269页起）","word":"提高计划针对性","def":"培训班不再一本教材讲到底，先调研企业缺什么、工人想学什么，再按需设课，每期都打在点子上。"},{"id":25,"bank":"词条（269页起）","word":"推动诚信体系建设","def":"市里建起企业信用档案，守信的审批走绿色通道，失信的贷款投标受限。商户说：'现在口碑就是真金白银。'"},{"id":26,"bank":"词条（269页起）","word":"规避风险","def":"企业签合同前请法务逐条审，投保出口信用险，把汇率波动写进条款，把可能的损失提前挡在门外。"},{"id":27,"bank":"词条（269页起）","word":"提高安全意识","def":"消防演练后，工人下班先查电线，电动车不再进楼充电，'万一呢'成了大家的口头禅。"},{"id":28,"bank":"词条（269页起）","word":"创新活动形式","def":"理论学习不再念文件，街道把政策编成情景剧、知识竞答，年轻人抢着报名。"},{"id":29,"bank":"词条（269页起）","word":"普及安全常识","def":"消防队把体验车开进社区，教孩子用灭火器、教大妈捂口鼻弯腰逃生，人人学了几招保命本领。"},{"id":30,"bank":"词条（269页起）","word":"规范社会行为","def":"市里出台文明行为条例，遛狗要牵绳、广场舞限时限量、高空抛物有说法，大家做事有了准绳。"},{"id":31,"bank":"词条（269页起）","word":"整治农村环境","def":"村里清掉多年积存垃圾，拆了私搭乱建，污水接管处理，臭水沟变成了荷花塘。"},{"id":32,"bank":"词条（269页起）","word":"科学规划部署","def":"新区动工前请三家设计院反复论证，产业放哪、绿地留哪、管线怎么走，算清楚了才动第一锹土。"},{"id":33,"bank":"词条（269页起）","word":"增强行业自律","def":"行业协会发布公约，会员企业签承诺不打价格战、不做虚假宣传，违反的在全行业通报。"},{"id":34,"bank":"词条（269页起）","word":"探索新模式","def":"供销社试水'土地托管'，农户把田交给合作社统一种，保底分红加二次返利，这做法没先例，边干边摸索。"},{"id":35,"bank":"词条（269页起）","word":"形成共识","def":"三次院落会后，原本反对装电梯的居民也点了头：'低层补一点、高层出一点，公平。'大家总算想到了一起。"},{"id":36,"bank":"词条（269页起）","word":"化解冲突矛盾","def":"两村为争水打了二十年官司，乡干部把双方老人请到一桌，查旧档、勘水源，最终定下轮灌方案。"},{"id":37,"bank":"词条（269页起）","word":"加强道德引导","def":"村里建起道德评议会，好媳妇好邻居由大家评，上红榜、广播里表扬，不孝敬老人的脸上挂不住。"},{"id":38,"bank":"词条（269页起）","word":"完善组织，加强领导","def":"县里成立专项工作组，一把手任组长，各部门职责写进任务清单，每周调度、每月通报。"},{"id":39,"bank":"词条（269页起）","word":"增强服务意识","def":"窗口人员不再坐着等群众上门，主动问'您要办什么'，备好老花镜和雨伞，陪老人走完流程。"},{"id":40,"bank":"词条（269页起）","word":"广泛听取民意","def":"公交线网调整前，交通局把方案挂网上征求意见，站台设意见箱，请乘客代表座谈。"},{"id":41,"bank":"词条（269页起）","word":"增强群众满意度","def":"窗口改造后回访电话问'您满意吗'，差评必须整改回访，好评率从七成升到九成八。"},{"id":42,"bank":"词条（269页起）","word":"赋予更多自主权","def":"开发区把项目备案、用地预审等权限交给园区，企业办事不用往市里跑，园区当场拍板。"},{"id":43,"bank":"词条（269页起）","word":"建立监管机制","def":"市里对外卖平台建立'双随机一公开'制度：随机抽商家、随机派检查员，结果网上公示。"},{"id":44,"bank":"词条（269页起）","word":"规范市场经营","def":"市场监管所对批发市场逐户过筛：无照的引导办照，过期的下架，秤具统一检定。"},{"id":45,"bank":"词条（269页起）","word":"提高政府管理效率","def":"过去办证跑五个部门二十天，现在一窗受理、内部流转，三天办结。"},{"id":46,"bank":"词条（269页起）","word":"增强公仆意识","def":"机关组织干部'当一天群众'，排队体验被推诿，局长红着脸说：'才知道老百姓办事多难。'"},{"id":47,"bank":"词条（269页起）","word":"优化公共交通","def":"市里调整公交线网接驳地铁口，加密夜间班次，换乘半小时内免费。"},{"id":48,"bank":"词条（269页起）","word":"完善配套公共服务","def":"新小区交付了，学校、卫生站、菜场却没跟上，居民买菜看病跑三公里，区里赶紧补建这些设施。"},{"id":49,"bank":"词条（269页起）","word":"优化管理水平","def":"物业上线数字工单系统，报修自动派单、限时办结、回访评价，投诉量降了六成。"},{"id":50,"bank":"词条（269页起）","word":"推广优秀经验","def":"某社区'院落议事'效果好，街道开现场会请书记讲做法，其他社区拿回去结合自家情况用。"},{"id":51,"bank":"词条（269页起）","word":"创新社区治理方式","def":"社区开发小程序，居民随手拍问题换积分兑日用品，从'站着看'变'抢着干'。"},{"id":52,"bank":"词条（269页起）","word":"严格执法","def":"环保局对偷排企业顶格罚款八十万、查封设备、拘留责任人，市长打电话说情也没用。"},{"id":53,"bank":"词条（269页起）","word":"加强社会共治","def":"食品安全不只靠监管所，外卖骑手当'移动哨兵'，消费者拍照举报，行业协会自查互查。"},{"id":54,"bank":"词条（269页起）","word":"落实激励奖励","def":"县里年底公开表彰'种粮能手'，发奖金、优先给农机补贴，台上戴红花，台下憋着劲明年争。"},{"id":55,"bank":"词条（269页起）","word":"权利下放、监管下放","def":"省里把审批权交给市县，同时派督察组跟着下去，确保'接得住、管得好'。"},{"id":56,"bank":"词条（269页起）","word":"推动公益事业建设","def":"县里用财政资金撬动社会捐赠，建起敬老院和儿童之家，志愿者定期上门服务。"},{"id":57,"bank":"词条（269页起）","word":"增强政府施政透明度","def":"市里把财政预算公开到'项'级科目，每一笔钱去哪了网上可查，重大项目先开听证会。"},{"id":58,"bank":"词条（269页起）","word":"打造服务型政府","def":"政府门户从'管理通知'改成'服务指南'，企业办事全程网办，干部多跑腿、群众少跑路。"},{"id":59,"bank":"词条（269页起）","word":"形成长效机制","def":"河道治理不再靠突击检查，河长制写进规章，巡河、考核、问责成了日常动作。"},{"id":60,"bank":"词条（269页起）","word":"提高政策落实效率","def":"补贴政策过去从发文到到账要三个月，现在'免申即享'，数据比对后一周到账。"},{"id":61,"bank":"词条（269页起）","word":"政府扶持、搭建平台","def":"县里给免费厂房、减免税收，建起公共检测中心和电商服务中心，小企业拎包入驻。"},{"id":62,"bank":"词条（269页起）","word":"利用新媒体和互联网平台","def":"县长直播卖橙子、文旅局长拍短视频，村里农产品通过微信群和直播间卖向全国。"},{"id":63,"bank":"词条（269页起）","word":"精简办事流程","def":"办出生证明过去要七份材料四个章，现在一张表单、一个窗口、当场办结。"},{"id":64,"bank":"词条（269页起）","word":"科学决策、民主决策","def":"垃圾焚烧厂选址先请专家论证，再请居民代表投票，两道关都过了才动工。"},{"id":65,"bank":"词条（269页起）","word":"方便民众生活","def":"社区建起食堂、维修站、快递柜，老人下楼吃热饭、取包裹不出小区。"},{"id":66,"bank":"词条（269页起）","word":"提供公平发展的机会","def":"县重点中学把六成招生名额分到农村初中，打工子弟和干部子女同卷同线。"},{"id":67,"bank":"词条（269页起）","word":"公共服务个性化、智能化","def":"政务APP根据年龄自动推送养老补贴，驾照到期前提醒换证，服务找人而不是人找服务。"},{"id":68,"bank":"词条（269页起）","word":"联合运营","def":"两市公交卡互认、景区联票、线路共设，收益按比例分成。"},{"id":69,"bank":"词条（269页起）","word":"提升执法效能","def":"城管用无人机巡查、AI识别违建，一个人管过去十个人的片区，办案时间缩了一半。"},{"id":70,"bank":"词条（269页起）","word":"净化网络环境","def":"平台下架低俗内容十二万条，封禁造谣账号，青少年模式过滤不良信息。"},{"id":71,"bank":"词条（269页起）","word":"分众管理","def":"社区把居民分成老人、租户、商户几类，不同群体推不同信息、给不同服务。"},{"id":72,"bank":"词条（269页起）","word":"提供信贷支持","def":"银行针对合作社推出'惠农贷'，不要抵押、凭信用评级授信，三天放款。"},{"id":73,"bank":"词条（269页起）","word":"提升服务水平","def":"医院设一站式服务中心，挂号缴费打报告同一层搞定，志愿者全程引导。"},{"id":74,"bank":"词条（269页起）","word":"提高诊疗服务水平","def":"县医院接通省城专家远程会诊，疑难杂症患者不用奔波，乡镇卫生院也能读CT片。"},{"id":75,"bank":"词条（269页起）","word":"建立健全风险保障制度","def":"县里给农户投保自然灾害险，大棚被洪水冲毁后一周理赔到账，农户不至于一灾返贫。"},{"id":76,"bank":"词条（269页起）","word":"完善绩效工资分配","def":"医院改革奖金方案：多劳多得、优绩优酬，向临床一线和夜班倾斜，大锅饭被打破。"},{"id":77,"bank":"词条（269页起）","word":"精准定位市场","def":"企业不做'所有人的生意'，调研后专做银发族徒步装备，销量翻番。"},{"id":78,"bank":"词条（269页起）","word":"营造公平就医环境","def":"医院打击号贩子，专家号全部线上放号，加塞走后门被杜绝，农村患者和城里患者一个规矩。"},{"id":79,"bank":"词条（269页起）","word":"提升学校的软硬件水平","def":"县里翻新教学楼、配齐多媒体教室，同时送教师进修、招骨干教师，硬件软件一起上。"},{"id":80,"bank":"词条（269页起）","word":"尊重群众知情权","def":"拆迁前补偿方案在村口公示三十天，每户丈量面积、算账明细可查，有疑问当天答复。"},{"id":81,"bank":"词条（269页起）","word":"推动医防融合","def":"家庭医生团队既看病也管预防，高血压患者服药后有人随访，社区医院开展慢病筛查。"},{"id":82,"bank":"词条（269页起）","word":"树立职业平等观念","def":"学校请快递冠军、大国工匠进课堂，孩子们明白当厨师和当科学家一样光荣。"},{"id":83,"bank":"词条（296页起）","word":"提供多层次就业岗位","def":"园区既有招博士的研发中心，也有招普工的装配车间，还有保洁保安等灵活岗位，不同学历的人都找得到位置。"},{"id":84,"bank":"词条（296页起）","word":"扭转教育功利化倾向","def":"学校不再按分数排名，开了劳动课和社团，家长也不再只问'这个考不考'。"},{"id":85,"bank":"词条（296页起）","word":"优化公共资源配置","def":"市里把三甲医院分院搬到新区，学校建在人口导入区，公交线网跟着客流热力图调。"},{"id":86,"bank":"词条（296页起）","word":"缩短出行时间","def":"地铁开通后，从郊区到市中心的通勤从九十分钟缩到三十五分钟。"},{"id":87,"bank":"词条（296页起）","word":"创新播出模式","def":"电视剧不再等电视台每天两集，平台一次放全集，观众还能选'只看主角线'。"},{"id":88,"bank":"词条（296页起）","word":"完善绿色配套设施","def":"新区建了自行车道、装了充电桩、布了回收箱，雨水花园收集径流。"},{"id":89,"bank":"词条（296页起）","word":"建立完善信用记录","def":"市里给企业和个人建信用档案，欠税、违约、违规都记进去，签合同前可查。"},{"id":90,"bank":"词条（296页起）","word":"加强隐私保护","def":"APP不再默认读取通讯录，人脸数据存在本地，快递单隐藏手机号。"},{"id":91,"bank":"词条（296页起）","word":"推进医疗服务均等化","def":"村卫生室接通县医院远程影像，农民不出村就能拿到和城里一样的诊断标准。"},{"id":92,"bank":"词条（296页起）","word":"提供精细化服务","def":"社区给每位老人建档：谁独居、谁有糖尿病、谁生日是哪天，服务按人送到。"},{"id":93,"bank":"词条（296页起）","word":"动态监管","def":"监管平台接企业排污传感器，数据实时更新，超标自动报警，不是年底才查一次。"},{"id":94,"bank":"词条（296页起）","word":"资源本土化","def":"教材不再用'怎么坐地铁'举例，改成'怎么赶场'；老师用方言讲故事，案例全是本县的。"},{"id":95,"bank":"词条（296页起）","word":"改善医患关系","def":"医院设'医患沟通室'，术前医生花半小时给家属讲方案，纠纷降了七成。"},{"id":96,"bank":"词条（296页起）","word":"激发内生动力","def":"帮扶队不再只给钱给物，帮村里建合作社、教电商，村民从'等靠要'变'争着干'。"},{"id":97,"bank":"词条（296页起）","word":"信息透明化","def":"村里把每笔补贴金额贴公示栏、发微信群，谁拿了多少一目了然。"},{"id":98,"bank":"词条（296页起）","word":"类别化管理","def":"园区把企业分成'培育型''成长型''成熟型'，不同类型给不同政策。"},{"id":99,"bank":"词条（296页起）","word":"专款专用","def":"改造资金单独设账户，买水泥的钱不能拿去吃饭，审计逐张查票据。"},{"id":100,"bank":"词条（296页起）","word":"改善投资环境","def":"市里把审批从两百天压到五十天，建标准厂房、引法院仲裁，企业家说：'在这能安心搞经营。'"},{"id":101,"bank":"词条（296页起）","word":"减少政策干预","def":"政府不再定价格、派订单，企业根据市场信号自己决定产什么、卖多少。"},{"id":102,"bank":"词条（296页起）","word":"加强个人信息保护","def":"平台被要求删除违规收集的用户数据，APP不得强制授权，倒卖手机号要追刑责。"},{"id":103,"bank":"词条（296页起）","word":"提高外来人口社区参与度","def":"社区请租户进议事会，办'新邻居'节，外来务工者也对社区事务投票。"},{"id":104,"bank":"词条（296页起）","word":"实现办事预约全覆盖","def":"所有政务事项都能小程序预约，从户籍到营业执照，不用凌晨排队。"},{"id":105,"bank":"词条（296页起）","word":"实现跨区域办理","def":"社保转移不用两地跑，在A市申请，B市线上办结。"},{"id":106,"bank":"词条（296页起）","word":"加大扶贫资金投入","def":"县财政帮扶预算从三千万增到八千万，覆盖产业、教育、住房。"},{"id":107,"bank":"词条（296页起）","word":"改善基层基础设施建设","def":"村里铺了沥青路、通了自来水、改了电网、建了5G基站。"},{"id":108,"bank":"词条（296页起）","word":"依据分类标准，有针对性处理","def":"市里按排污把企业分ABCD四级，A级无事不扰，D级天天查。"},{"id":109,"bank":"词条（296页起）","word":"多策并举","def":"治电动车乱象，市里同时建充电桩、降充电费、装电梯阻车器、罚违规者，几招一起上。"},{"id":110,"bank":"词条（296页起）","word":"创新执法模式","def":"城管推行'首违不罚'，第一次违规教育加承诺，再犯才罚，商户说有温度。"},{"id":111,"bank":"词条（296页起）","word":"公平对待外来人员","def":"市公办学校对务工子女与本地孩子同标准招生、混合编班，公租房也接受非户籍申请。"},{"id":112,"bank":"词条（296页起）","word":"完善引进人才的配套服务","def":"市里给引进的博士建人才公寓，安排子女入学，协助配偶就业。"},{"id":113,"bank":"词条（296页起）","word":"优化城区间的人才资源配置","def":"市里建'共享用工'池，A区闲置工程师去B区项目，编制跟着人走。"},{"id":114,"bank":"词条（296页起）","word":"以老带新","def":"车间给每个新工人配师傅，师傅先示范再看着徒弟做，三十年经验手把手传。"},{"id":115,"bank":"词条（296页起）","word":"构建公平用人机制","def":"企业晋升不再看关系，全员竞聘、业绩说话，董事长侄子也被淘汰。"},{"id":116,"bank":"词条（296页起）","word":"加大检查力度","def":"市场监管局从'一季一查'改'每周抽查'，检查员翻倍、覆盖面扩大。"},{"id":117,"bank":"词条（296页起）","word":"线上推送信息","def":"政务APP把补贴政策自动推给符合条件的企业，不用自己翻文件，政策找人。"},{"id":118,"bank":"词条（296页起）","word":"畅通表达","def":"市里开'给书记留言'入口，24小时回复，合理建议被采纳，市民的话能传到决策层。"},{"id":119,"bank":"词条（296页起）","word":"宣传典型模范","def":"县里把'好媳妇''种粮能手'搬上电视报纸，组织事迹报告团，大家学身边人。"},{"id":120,"bank":"词条（296页起）","word":"将理论与实践相结合","def":"党校把课堂搬到田间，上午学政策、下午帮村民收稻，干部说：'书本这才活了。'"},{"id":121,"bank":"词条（296页起）","word":"明确各主体责任","def":"任务清单写清谁干什么：环保管排污、住建管管网、街道管巡查，不再踢皮球。"},{"id":122,"bank":"词条（296页起）","word":"强化领导责任","def":"县里规定出了安全事故先追分管领导，'一岗双责'写进考核。"},{"id":123,"bank":"词条（296页起）","word":"打破信息壁垒","def":"市里打通公安、民政、人社数据，办证不再跑几个部门'证明我是我'。"},{"id":124,"bank":"词条（296页起）","word":"厘清政府与市场的职责","def":"政府退出能由竞争形成价格的领域，专注监管和公共服务，企业自主决定生产经营。"},{"id":125,"bank":"词条（296页起）","word":"权责到人","def":"每段河长公示牌上有责任人姓名电话，出了问题直接找到人。"},{"id":126,"bank":"词条（313页起）","word":"丰富群众文化生活","def":"村里每月办'村晚'，社区有合唱团和广场舞队，图书馆开到晚上九点。"},{"id":127,"bank":"词条（313页起）","word":"提高群众文化水平","def":"县里办农民夜校，教认字、教智能手机、教农技，村民现在能读合同、会开直播。"},{"id":128,"bank":"词条（313页起）","word":"推进医疗服务均等化","def":"省三甲医院与县医院结对，专家定期下沉坐诊，县里患者拿到省级方案。"},{"id":129,"bank":"词条（313页起）","word":"完善公共文化服务","def":"县里建图书馆文化馆，乡镇有综合文化站，村有农家书屋，全部免费开放。"},{"id":130,"bank":"词条（313页起）","word":"强化办学合作","def":"职校与企业合办'订单班'，课程共同开发、师资互派，学生毕业即上岗。"},{"id":131,"bank":"词条（313页起）","word":"重视家风教育","def":"村里收集家训挂门楣，开'家庭故事会'，长辈给晚辈讲怎么做人。"},{"id":132,"bank":"词条（313页起）","word":"提高产业链层级","def":"县里不再只卖原矿，建起冶炼、深加工、研发环节，从'卖资源'走向'卖技术'。"},{"id":133,"bank":"词条（313页起）","word":"阅读方式创新","def":"图书馆推出'听书借阅'，通勤路上用耳朵读书，AR古籍扫码'活'起来。"},{"id":134,"bank":"词条（313页起）","word":"保护文化资源","def":"县里普查老建筑、登记非遗、数字化古籍，方言和民歌被录下来存进库。"},{"id":135,"bank":"词条（313页起）","word":"优化书目类别","def":"农家书屋撤下过时养殖书，添了电商、短视频制作、儿童绘本，借阅率翻三倍。"},{"id":136,"bank":"词条（313页起）","word":"加大教育投入","def":"县教育预算年增一成五，建新校、涨教师工资、更新设备。"},{"id":137,"bank":"词条（313页起）","word":"重视职业技术培训","def":"市里把技能培训列为民生项目，补贴学费，工人拿证又涨薪。"},{"id":138,"bank":"词条（313页起）","word":"保护历史文化遗产完整性和原真性","def":"古镇修缮'修旧如旧'，原砖原瓦编号回装，不造假古董、不拆真遗产。"},{"id":139,"bank":"词条（313页起）","word":"丰富课余生活","def":"学校开了四十个社团：机器人、戏剧、种植，放学后孩子不再只写作业。"},{"id":140,"bank":"词条（313页起）","word":"转变农业生产方式","def":"村里种地不再靠经验，无人机打药、传感器测墒，一个人管千亩田。"},{"id":141,"bank":"词条（313页起）","word":"破除城乡二元结构","def":"县里统一城乡户籍、社保、公共服务标准，农民和市民一个规矩。"},{"id":142,"bank":"词条（313页起）","word":"加强警民联系","def":"社区民警照片电话贴每栋楼门口，微信群24小时回应，定期入户走访。"},{"id":143,"bank":"词条（313页起）","word":"因材施教","def":"老师给不同学生布置不同作业：快的做拓展，慢的补基础，人人有进步。"},{"id":144,"bank":"词条（313页起）","word":"提升素养","def":"博物馆开公益讲座，社区教礼仪，城市推阅读，市民言谈举止在变。"},{"id":145,"bank":"词条（313页起）","word":"提高知名度，扩大影响力","def":"县里橙子上了央视、拿了国际奖，出口订单翻三倍，外国人也知道这个小县。"},{"id":146,"bank":"词条（313页起）","word":"融入文化经典","def":"游戏用山海经神兽做角色，动画改编西游记，年轻人追着经典跑。"},{"id":147,"bank":"词条（313页起）","word":"限制外来文化商品","def":"该国对进口电影设配额、对外版图书加关税，保护本土创作空间。"},{"id":148,"bank":"词条（313页起）","word":"完善对文化设施管理","def":"图书馆定借阅规则，文化馆排活动表，设备定期维护，不再'建而不用'。"},{"id":149,"bank":"词条（313页起）","word":"发挥典范和楷模带头作用","def":"村里'党员示范棚'产量高三成，村民看着跟着学，全村换了新品种。"},{"id":150,"bank":"词条（313页起）","word":"加大技术创新","def":"企业把研发经费占营收比从三个点提到八个点，建实验室、招博士团队。"},{"id":151,"bank":"词条（313页起）","word":"鼓励企业研发","def":"政府对研发费用加计扣除，首台套设备给补贴，专利申请给奖励。"},{"id":152,"bank":"词条（313页起）","word":"攻克关键技术","def":"团队五年磨一剑，国产光刻光源终于点亮，不再受制于人。"},{"id":153,"bank":"词条（313页起）","word":"改进生产工艺","def":"工厂把手工焊改激光焊，不良率从百分之二降到千分之二。"},{"id":154,"bank":"词条（313页起）","word":"提升技术服务","def":"设备厂商提供'远程诊断'，故障在线定位，工程师24小时到场。"},{"id":155,"bank":"词条（313页起）","word":"创新商业模式","def":"企业不再卖设备改卖'服务时长'，客户按使用付费，厂商负责维护。"},{"id":156,"bank":"词条（313页起）","word":"引进先进技术","def":"企业引进德国产线专利，派团队培训，两年实现国产化。"},{"id":157,"bank":"词条（313页起）","word":"加强知识产权保护","def":"市里设知识产权快速法庭，侵权案三个月审结，赔偿额翻倍。"},{"id":158,"bank":"词条（313页起）","word":"拓宽招聘渠道","def":"企业不再只跑招聘会，直播带岗、校企合作、内部推荐一起上。"},{"id":159,"bank":"词条（313页起）","word":"精准性培训","def":"县里先摸企业技能缺口，再按岗位设课，培训完就上岗。"},{"id":160,"bank":"词条（313页起）","word":"发挥人的主观能动性","def":"车间让工人自己提改进方案，好点子给奖励，人人琢磨怎么干得更好。"},{"id":161,"bank":"词条（313页起）","word":"采用国际先进标准","def":"企业产品按欧盟标准生产，检测指标严于国标，出口免检。"},{"id":162,"bank":"词条（313页起）","word":"加大教育资源投入","def":"省里资金向农村校倾斜，建实验室、配电脑、派骨干轮岗。"},{"id":163,"bank":"词条（313页起）","word":"加快技术迭代更新","def":"手机厂商半年发新品，芯片一年一升级，旧型号快速退市。"},{"id":164,"bank":"词条（313页起）","word":"提升教学能力","def":"学校送教师进修、办教学比武、请名师带教，课堂质量明显提升。"},{"id":165,"bank":"词条（313页起）","word":"食品安全溯源体系","def":"每棵菜带二维码，扫码看哪块地、哪批药、谁检测，出问题追到源头。"},{"id":166,"bank":"词条（313页起）","word":"（字迹模糊：物联网…媒体类）","def":null},{"id":167,"bank":"词条（313页起）","word":"大数据应用","def":"市里用出租车轨迹数据优化红绿灯，用电数据判断企业开工，用医疗数据预测流感。"},{"id":168,"bank":"词条（313页起）","word":"提升环保意识","def":"垃圾分类讲座后，大妈开始攒纸箱瓶子，孩子提醒家长别乱扔。"},{"id":169,"bank":"词条（313页起）","word":"推进能源革命","def":"省里关小煤矿、建风光基地，非化石能源占比提到四成。"},{"id":170,"bank":"词条（313页起）","word":"恢复生物多样性","def":"湿地修复后，白鹭回来了，鱼群翻倍，珍稀植物重新被发现。"},{"id":171,"bank":"词条（313页起）","word":"推行绿色化生产","def":"工厂改水性漆、废水回用、废料做原料，排放降八成。"},{"id":172,"bank":"词条（313页起）","word":"调节局部小气候","def":"城市建湿地公园后，周边夏天降温两度，湿度上升。"},{"id":173,"bank":"词条（313页起）","word":"针对性处理垃圾","def":"社区把厨余堆肥、危废专运、可回收物卖钱，不同废物不同去处。"},{"id":174,"bank":"词条（313页起）","word":"形成垃圾分类处理链","def":"居民源头分类、收运车分类拉、终端堆肥焚烧回收，全链条打通。"},{"id":175,"bank":"词条（313页起）","word":"改善空气质量","def":"关停散乱污、控机动车排放后，市里优良天数从两百天升到三百天。"},{"id":176,"bank":"词条（313页起）","word":"提高绿化覆盖率","def":"市里建口袋公园、屋顶花园、道路绿带，人均绿地增三平米。"},{"id":177,"bank":"词条（313页起）","word":"发展产业集群","def":"县里把五十家汽配企业聚到一个园区，楼上设计、楼下生产、对面检测。"},{"id":178,"bank":"词条（313页起）","word":"产业链条完整","def":"从棉花纺纱到成衣设计到电商销售，县内全搞定，不用外发加工。"},{"id":179,"bank":"词条（313页起）","word":"综合配套齐全","def":"园区有宿舍食堂学校医院物流，企业入驻员工安家。"},{"id":180,"bank":"词条（313页起）","word":"进行市场化运作","def":"景区不再靠财政拨款，引专业公司经营，自负盈亏，利润再投入。"},{"id":181,"bank":"词条（313页起）","word":"聚焦优势产业","def":"县里不追所有风口，专注茶叶和旅游，把长板做长。"},{"id":182,"bank":"词条（313页起）","word":"优化营商环境","def":"市里推'一网通办''首违不罚''安静生产日'，企业满意度升到九成五。"},{"id":183,"bank":"词条（313页起）","word":"无害化处理","def":"医废高温焚烧，渗滤液处理达标再排，残渣安全填埋。"},{"id":184,"bank":"词条（313页起）","word":"垃圾回收再利用","def":"旧轮胎做跑道，建筑垃圾做砖，厨余做肥。"},{"id":185,"bank":"词条（313页起）","word":"完善冷链物流网络","def":"县里建预冷库、购冷藏车、接城市冷链，水果损耗从两成降到半成。"},{"id":186,"bank":"词条（313页起）","word":"减少流通环节","def":"蔬菜从地头直供社区店，跳过三级批发，价格降三成、农民多赚。"},{"id":187,"bank":"词条（313页起）","word":"加强法治建设","def":"市里立五部地方性法规，建公共法律服务中心，培训'法律明白人'。"},{"id":188,"bank":"词条（313页起）","word":"规范考核制度","def":"县里改考核：不再唯GDP，加生态、民生、债务指标，结果与晋升挂钩。"},{"id":189,"bank":"词条（313页起）","word":"规范操作流程","def":"车间把SOP贴每个工位，先哪步后哪步、多少秒，写清楚，新工人照图做。"},{"id":190,"bank":"词条（313页起）","word":"提高处罚标准","def":"新规把偷排罚款上限从二十万提到一百万，还按日计罚。"},{"id":191,"bank":"词条（313页起）","word":"强化法治意识","def":"'宪法周'活动后，市民遇事说'看看法条'，干部决策先问'有没有法律依据'。"},{"id":192,"bank":"词条（313页起）","word":"提升效率","def":"工厂引入流水线，人均产出翻番，交付周期砍半。"},{"id":193,"bank":"词条（313页起）","word":"提升收益","def":"合作社统购统销，成本降一成五、售价升一成，社员分红翻倍。"},{"id":194,"bank":"词条（313页起）","word":"降低风险","def":"企业分散供应商、买保险、设安全库存，断供不再停产。"},{"id":195,"bank":"词条（313页起）","word":"倒逼产业升级","def":"环保标准收紧，达不到的小铸造关停，活下来的投新设备，行业整体水平上来了。"},{"id":196,"bank":"词条（313页起）","word":"打造本土品牌","def":"县里注册'XX红'区域公用品牌，统一包装标准，土货有了自己的名字。"},{"id":197,"bank":"词条（313页起）","word":"增加产品附加值","def":"县里不再卖生土豆，做薯片、淀粉，同一颗土豆价值翻三倍。"},{"id":198,"bank":"词条（313页起）","word":"塑造核心竞争力","def":"企业十年磨一道工艺，对手抄不走，客户只认它。"},{"id":199,"bank":"词条（313页起）","word":"鼓励社会资本投入","def":"政府把地铁、污水处理向民企开放，给特许经营和补贴，民间资本进来了。"},{"id":200,"bank":"词条（313页起）","word":"延伸产业链","def":"苹果县建果汁加工、果渣饲料、果园旅游，一颗苹果'吃干榨净'。"},{"id":201,"bank":"词条（313页起）","word":"产业融合发展","def":"村里把种植、加工、旅游拧成一股，游客摘果住民宿买伴手礼，三产变一产。"},{"id":202,"bank":"词条（313页起）","word":"创造经济效益","def":"技改投两千万，年省加增收五千万，两年回本。"},{"id":203,"bank":"词条（313页起）","word":"降低融资门槛","def":"银行推'信用贷'，不要抵押，纳税记录当信用，小店也能借到钱。"},{"id":204,"bank":"词条（313页起）","word":"调整产业结构","def":"市里压钢铁产能，育新能源和生物医药，'重'变'轻'、'旧'变'新'。"},{"id":205,"bank":"词条（313页起）","word":"集约化经营","def":"村里把零散田流转给合作社，统一机耕、灌溉、销售，亩均成本降三成。"},{"id":206,"bank":"词条（313页起）","word":"开拓产业发展空间","def":"县里用废弃矿坑建光伏，盐碱地种中药材，'废地'变'宝地'。"},{"id":207,"bank":"词条（313页起）","word":"多方筹措资金","def":"修村路：财政给一点、企业捐一点、村民出一点、银行贷一点，钱凑齐了。"},{"id":208,"bank":"词条（340页起）","word":"优化就业结构","def":"市里三产就业占比从四成升到六成，更多人从工厂转向服务和研发。"},{"id":209,"bank":"词条（340页起）","word":"降低人力成本","def":"工厂上机器人，同样产量用工从两百降到五十。"},{"id":210,"bank":"词条（340页起）","word":"积极开拓国内外市场","def":"企业既跑广交会也跑法兰克福展，产品卖到东南亚和欧洲。"},{"id":211,"bank":"词条（340页起）","word":"瞄准市场空白","def":"企业发现没人做'左撇子剪刀'，专攻这个，拿下八成细分份额。"},{"id":212,"bank":"词条（340页起）","word":"释放消费潜力","def":"市里发消费券、办夜市、补农村电商点，社零总额增两成。"},{"id":213,"bank":"词条（340页起）","word":"提高用户黏度","def":"APP加签到积分、会员日、个性化推荐，用户一天打开三次，离不开。"},{"id":214,"bank":"词条（340页起）","word":"树立理性的消费观","def":"年轻人不再盲追大牌，比价、看评测、买适合自己的，'平替'成风。"},{"id":215,"bank":"词条（340页起）","word":"严把质量检测关","def":"工厂每批全检，一件不合格整批返工，质量科长有'一票否决权'。"},{"id":216,"bank":"词条（340页起）","word":"严格执行工序步骤","def":"车间要求'一步不能省'，老师傅也照图做，违反扣绩效。"},{"id":217,"bank":"词条（340页起）","word":"尊重市场规律","def":"政府不再定菜价，让供求决定，价高农民自然多种。"},{"id":218,"bank":"词条（340页起）","word":"个性化包装","def":"企业在礼盒印客户名字和祝福，每盒独一无二，复购率翻倍。"},{"id":219,"bank":"词条（340页起）","word":"提高市场竞争力","def":"企业成本降两成、质量升一档，同价位客户选它。"},{"id":220,"bank":"词条（340页起）","word":"激发创业创新热情","def":"市里办创业大赛、给免费孵化位、放创业贷，大学生注册数翻倍。"},{"id":221,"bank":"词条（340页起）","word":"探索创新信贷方式","def":"银行试水'直播流水贷''专利质押贷'，新形态也能融到资。"},{"id":222,"bank":"词条（340页起）","word":"健全行业标准","def":"协会牵头定'预制菜'团体标准，原料、工艺、标注有说法，企业有章可循。"},{"id":223,"bank":"词条（340页起）","word":"降低准入门槛","def":"市里把小餐饮'审批制'改'备案制'，不用跑许可证，网上备案就开业。"},{"id":224,"bank":"词条（340页起）","word":"推动品牌升级","def":"老字号换包装、开旗舰店、做联名，年轻人开始排队买。"},{"id":225,"bank":"词条（340页起）","word":"推动品牌创新","def":"企业推子品牌，用新设计新渠道，与老品牌形象区隔。"},{"id":226,"bank":"词条（340页起）","word":"盘活人力资源","def":"企业让闲置后勤人员培训后转岗销售，不裁员但效率升。"},{"id":227,"bank":"词条（340页起）","word":"发展电商渠道","def":"村里开网店、做直播、接社区团购，农产品卖全国。"},{"id":228,"bank":"词条（340页起）","word":"积极开拓市场","def":"企业派团队跑五省、参十展，新签二十家经销商。"},{"id":229,"bank":"词条（340页起）","word":"推动产品深加工","def":"县里不再卖生核桃，做核桃油、蛋白粉、壳活性炭，价值翻几番。"},{"id":230,"bank":"词条（340页起）","word":"推动科技成果产业化","def":"高校专利许可给企业，实验室样品变产线商品，年产值过亿。"},{"id":231,"bank":"词条（340页起）","word":"拉动经济增长","def":"高铁开通带来游客、物流、投资，县GDP增速从五个点升到八个点。"},{"id":232,"bank":"词条（169页起）","word":"独角兽企业","def":"这家创业公司成立五年，估值超十亿美元，还没上市，VC排队投。"},{"id":233,"bank":"词条（169页起）","word":"瞪羚企业","def":"小公司营收连续三年翻番，爆发式成长，是细分领域的'小巨人'。"},{"id":234,"bank":"词条（169页起）","word":"新型离岸贸易","def":"企业货物从越南直发欧洲，但订单、结算、研发在上海，'买全球卖全球'不经手货物。"},{"id":235,"bank":"词条（169页起）","word":"企业过于功利","def":"公司只接快钱项目，不投研发不养人才，市场一变就没后手。"},{"id":236,"bank":"词条（169页起）","word":"满足消费者的需求","def":"企业调研千名用户，按吐槽改产品，加用户想要的功能。"},{"id":237,"bank":"词条（169页起）","word":"执行不力","def":"政策挺好，到基层'文件传达文件、会议落实会议'，没人盯没人问。"},{"id":238,"bank":"词条（169页起）","word":"执法不严","def":"偷排被抓，一个电话说情就'教育为主'，法律成了'橡皮筋'。"},{"id":239,"bank":"词条（169页起）","word":"缺乏奖励激励","def":"干多干少一个样、干好干坏一个样，没奖金没表彰，人人'躺平'。"},{"id":240,"bank":"词条（169页起）","word":"管理滞后","def":"行业变了，监管办法还是十年前的，新问题没人管。"},{"id":241,"bank":"词条（169页起）","word":"差异化发展道路","def":"县里不抄别人的工业园，依托生态搞有机农业和康养旅游，走不同的路。"},{"id":242,"bank":"词条（169页起）","word":"可持续发展","def":"林场只砍成材树、种幼苗、发展林下养殖，山常青、日子越好。"},{"id":243,"bank":"词条（169页起）","word":"循环经济绿色发展","def":"园区把A企业废料变B企业原料，废水回用、余热供暖，'排放'变'资源'。"},{"id":244,"bank":"词条（169页起）","word":"垃圾分类","def":"社区摆四色桶，厨余、可回收、有害、其他，各进各的。"},{"id":245,"bank":"词条（169页起）","word":"公司化","def":"村集体成立公司，聘职业经理人，按股份运营，集体经济有了'法人'。"},{"id":246,"bank":"词条（169页起）","word":"规范化","def":"车间从'师傅感觉'变'白纸黑字的标准'，每步有规矩、每笔可追溯。"},{"id":247,"bank":"词条（169页起）","word":"规模化","def":"合作社把千亩田连片，统一品种机耕，亩均成本降、议价能力升。"},{"id":248,"bank":"词条（169页起）","word":"产业化","def":"非遗作坊从'家庭工坊'变'标准工厂'，设计生产销售成链，老手艺变大生意。"},{"id":249,"bank":"词条（169页起）","word":"市场化运作","def":"景区引专业公司，自负盈亏，票价随需求浮动，不再靠财政拨款。"},{"id":250,"bank":"词条（169页起）","word":"盲目投入","def":"县里看别人上光伏也跟着上，没算资源和消纳，设备一半晒太阳。"},{"id":251,"bank":"词条（169页起）","word":"合作不畅","def":"两家企业签战略协议，但数据不共享、标准不统一，会开了事没办。"},{"id":252,"bank":"词条（169页起）","word":"过度市场化","def":"医院把科室承包给个人，医生收入与开单挂钩，'大处方'泛滥，公益性丢了。"},{"id":253,"bank":"词条（169页起）","word":"利益驱使","def":"企业明知偷排违法，但治污贵、罚款便宜，'算账'驱动了行为。"},{"id":254,"bank":"词条（169页起）","word":"过度开发","def":"古镇开二十家酒吧、五十家纪念品店，原住民搬走，'老街'变'商业街'。"},{"id":255,"bank":"词条（169页起）","word":"秉持合作共赢","def":"企业把技术分享给供应商，帮它改造，成本降质量升，双方都赚。"},{"id":256,"bank":"词条（169页起）","word":"消费升级","def":"居民不再'有没有'而要'好不好'，有机食品、智能家电、定制游销量大涨。"},{"id":257,"bank":"词条（169页起）","word":"优化产业布局","def":"市里把工厂搬出主城进园区，研发总部留中心，'生产''生活'各得其所。"},{"id":258,"bank":"词条（169页起）","word":"新旧动能转换","def":"老钢城关高炉、育新能源和数字经济，'黑GDP'变'绿GDP'。"},{"id":259,"bank":"词条（169页起）","word":"资本下乡","def":"企业到村租千亩地建现代农业，农民拿租金加工资加分红。"},{"id":260,"bank":"词条（169页起）","word":"过度商业化","def":"古村进门收费、拍照点要钱、祈福要'功德'，游客说：'味没了'。"},{"id":261,"bank":"词条（169页起）","word":"选用上乘原料","def":"企业只用核心产区明前茶芽，手工采摘，成本高三倍但口感不同。"},{"id":262,"bank":"词条（169页起）","word":"准确定位消费群体","def":"品牌专做'新中产妈妈'，产品、定价、渠道都围着她们转，转化率是行业两倍。"},{"id":263,"bank":"词条（169页起）","word":"社会阶层流动","def":"农家子弟考上大学进城当工程师，外卖员创业当老板，'命运'可以改。"},{"id":264,"bank":"词条（169页起）","word":"发展眼光短浅","def":"企业只接代工单，不做品牌不投研发，订单一转走就啥也没。"},{"id":265,"bank":"词条（169页起）","word":"证书含金量低","def":"培训机构'包过'，考试走形式，用人单位不认证书，就是张纸。"},{"id":266,"bank":"词条（169页起）","word":"求职者自我定位偏差","def":"毕业生只盯'管理岗'，不愿下基层，能力又匹配不上，'高不成低不就'。"},{"id":267,"bank":"词条（169页起）","word":"差异化学习","def":"平台按用户水平推不同内容：新手学基础、进阶学实战，各取所需。"},{"id":268,"bank":"词条（169页起）","word":"产需精准对接","def":"合作社先与超市签订单，再按单种植，不再'菜贱伤农'。"},{"id":269,"bank":"词条（169页起）","word":"销售三无产品","def":"摊贩卖无生产日期、无合格证、无厂家的零食，便宜但没人敢买。"},{"id":270,"bank":"词条（169页起）","word":"缺乏定价权","def":"企业产品不错，但价格由外国买家定，只赚加工费，'汗水钱'被拿走。"},{"id":271,"bank":"词条（169页起）","word":"生产认证标准不统一","def":"同一产品三省要三种不同认证，企业跑断腿，成本翻倍。"},{"id":272,"bank":"词条（169页起）","word":"盲目崇拜洋货","def":"消费者觉得'进口就是好'，国产同质量半价却没人买。"},{"id":273,"bank":"词条（169页起）","word":"企业恶性竞争","def":"同行打价格战，低于成本卖，偷工减料，全行业亏。"},{"id":274,"bank":"词条（169页起）","word":"差异化定价策略","def":"企业对不同客户定不同价：批量折扣、定制溢价、会员价，各段都吃到。"},{"id":275,"bank":"词条（169页起）","word":"打工心态","def":"员工觉得'给老板干的'，不主动不担责，到点就走。"},{"id":276,"bank":"词条（169页起）","word":"阶层固化","def":"农家子弟还是农民，工人子弟还是工人，'跨阶层'越来越难，'努力改变命运'被质疑。"},{"id":277,"bank":"词条（169页起）","word":"产业空心化","def":"市里工厂搬走，只剩房地产和商贸，'城造好了，产业没了'。"},{"id":278,"bank":"词条（169页起）","word":"加强自律","def":"协会发公约，会员自查自纠，违反的通报，不等政府来管。"},{"id":279,"bank":"词条（169页起）","word":"个性化推荐","def":"APP按浏览记录推内容，你喜欢什么就来什么，'越用越懂你'。"},{"id":280,"bank":"词条（169页起）","word":"土地撂荒","def":"年轻人外出打工，老人种不动，良田长草，'谁来种地'成问题。"},{"id":281,"bank":"词条（169页起）","word":"消费小众化","def":"年轻人不再追'大而全'，买'小而美'，汉服、露营、手作各有圈子。"},{"id":282,"bank":"词条（169页起）","word":"工作环境恶劣","def":"车间夏天热冬天冷，粉尘大噪声响，工人留不住。"},{"id":283,"bank":"词条（169页起）","word":"传统热门职业","def":"公务员、教师、医生，父母辈的'铁饭碗'仍是年轻人首选。"},{"id":284,"bank":"词条（169页起）","word":"产品销路不畅","def":"果子不错但没人来收，烂在库里，农民着急。"},{"id":285,"bank":"词条（169页起）","word":"经营品种专一","def":"小店三十年只卖一种面，不扩张、不搞多种经营，'一招鲜'吃遍天。"},{"id":286,"bank":"词条（169页起）","word":"不偷工减料","def":"企业用料足、工序全，从不走捷径，'一分钱一分货'是口碑。"},{"id":287,"bank":"词条（169页起）","word":"专业化运营","def":"村里请专业团队运营旅游，营销服务管理各有专人，不再'农民啥都干'。"},{"id":288,"bank":"词条（169页起）","word":"整合资源","def":"县里把分散景点打包，统一品牌、门票、营销，'指头'变'拳头'。"},{"id":289,"bank":"词条（169页起）","word":"市场前景广阔","def":"行业渗透率才一成，需求年增两成，'天花板'还远。"},{"id":290,"bank":"词条（169页起）","word":"井喷式增长","def":"产品月销从千件到十万件，订单涌进来，产能跟不上。"},{"id":291,"bank":"词条（169页起）","word":"涵盖领域广","def":"平台服务覆盖吃喝玩乐教医住行，'一个APP全搞定'。"},{"id":292,"bank":"词条（169页起）","word":"断崖式下降","def":"行业营收一季度腰斩，订单消失，企业裁员。"},{"id":293,"bank":"词条（169页起）","word":"错失转型良机","def":"企业看到趋势但犹豫，等决定动手，对手已占市场。"},{"id":294,"bank":"词条（169页起）","word":"化解风险","def":"政府设应急基金、帮企业债务重组，'潜在的雷'一个个拆掉。"},{"id":295,"bank":"词条（169页起）","word":"企业撤资","def":"外企关厂、设备运回本国，千名工人失业。"},{"id":296,"bank":"词条（169页起）","word":"市场低迷","def":"订单减半、库存积压、降价也没人买，全行业'喘不过气'。"},{"id":297,"bank":"词条（169页起）","word":"产品适应性强","def":"设备在高原、海岛、沙漠都能用，不同环境不用改。"},{"id":298,"bank":"词条（169页起）","word":"防范金融及次贷危机","def":"国家提高银行资本要求、收紧房贷审查，'泡沫'没长大就被摁住。"},{"id":299,"bank":"词条（169页起）","word":"零工经济","def":"外卖骑手、网约车司机、自由设计师不签劳动合同，平台接单，'灵活就业'。"},{"id":300,"bank":"词条（169页起）","word":"平台经济","def":"企业不拥有出租车和酒店，用APP连接供需，抽佣金，'轻资产重连接'。"},{"id":301,"bank":"词条（169页起）","word":"裂变效应明显","def":"APP'邀好友得奖励'，一传十十传百，用户指数级增长。"},{"id":302,"bank":"词条（169页起）","word":"行业前景广阔","def":"行业处于成长早期，政策支持、需求爆发，'赛道长雪厚'。"},{"id":303,"bank":"词条（169页起）","word":"形成集聚效应","def":"五十家企业聚一园，共享供应商、人才池、物流，成本比分散低两成。"},{"id":304,"bank":"词条（169页起）","word":"地理区位优越","def":"市里处两条高铁交汇，两小时到三个省会，物流成本区域最低。"},{"id":305,"bank":"词条（169页起）","word":"经济环境好","def":"市里民营经济活跃、产业链全、消费旺，企业'长得大'。"},{"id":306,"bank":"词条（169页起）","word":"瞄准市场，率先行动","def":"企业看到'银发经济'趋势，比同行早半年开发产品，抢得先机。"},{"id":307,"bank":"词条（169页起）","word":"生产方式落后","def":"车间还靠手工经验，无标准无数据，质量靠'手感'，效率上不去。"},{"id":308,"bank":"词条（169页起）","word":"产业发展乏力","def":"县里产业多年无新项目，老企业不长个，GDP增速全市垫底。"},{"id":309,"bank":"词条（169页起）","word":"经济来源单一","def":"村只靠种植，无加工无旅游，价一跌全村收入跌。"},{"id":310,"bank":"词条（169页起）","word":"赛事同质化","def":"各城市都跑马拉松，路线、奖牌、赞助商一样，跑者'分不清'。"},{"id":311,"bank":"词条（169页起）","word":"缺乏特色","def":"古镇'千镇一面'：纪念品店、小吃街、'网红'打卡点都一样，游客'看一个就不用看别的'。"},{"id":312,"bank":"词条（169页起）","word":"缺少本土品牌","def":"县里产品不错但都给别人代工，没自己的名字，'为他人作嫁衣裳'。"},{"id":313,"bank":"词条（169页起）","word":"产能过剩","def":"行业设备利用率才六成，库存积压、价格跌破成本，企业还卖不动。"},{"id":314,"bank":"词条（196页起）","word":"市场秩序混乱","def":"市场里无照经营、假冒伪劣、价格欺诈，'劣币驱逐良币'。"},{"id":315,"bank":"词条（196页起）","word":"品质提升难度大","def":"企业想提质量，但设备老、工人技能不够、资金紧，'想而不能'。"},{"id":316,"bank":"词条（196页起）","word":"滋生灰色产业链","def":"围绕'挂号黄牛'，有抢票软件、内部关系、层层加价，一条'隐形链条'靠它吃饭。"},{"id":317,"bank":"词条（196页起）","word":"影响消费体验","def":"景区排队长、厕所脏、强制购物，游客说：'再也不来'。"},{"id":318,"bank":"词条（196页起）","word":"市场竞争力弱","def":"产品价格、质量、品牌都没优势，客户'一眼就选别人'。"},{"id":319,"bank":"词条（196页起）","word":"品牌竞争力弱","def":"牌子知名度低、无溢价，消费者'不认'，同质量卖半价。"},{"id":320,"bank":"词条（196页起）","word":"资金管理不规范","def":"企业账目混乱，公私款混用，支出无审批，'老板口袋就是公司账'。"},{"id":321,"bank":"词条（196页起）","word":"政府债务负担过重","def":"县财政年收入十亿，债务利息要还三亿，'借新还旧'。"},{"id":322,"bank":"词条（196页起）","word":"盲目招商，目光短浅","def":"县里'捡到篮里都是菜'，引高污染企业换GDP，税收没多少，治理成本巨大。"},{"id":323,"bank":"词条（196页起）","word":"产品可替代性强","def":"产品无技术壁垒，对手三个月就能仿，客户'随时换'。"},{"id":324,"bank":"词条（196页起）","word":"消费者忠诚度不足","def":"牌子无复购，客户'谁打折买谁'，促销一停销量就停。"},{"id":325,"bank":"词条（196页起）","word":"市场饱和","def":"行业渗透率九成，新客难找，增长'触顶'。"},{"id":326,"bank":"词条（196页起）","word":"贸易壁垒","def":"该国对进口钢材加高关税、设技术标准，外国货'进不来'。"},{"id":327,"bank":"词条（196页起）","word":"政府补贴力度不足","def":"新能源企业补贴只覆盖研发的一成，'撒胡椒面'，不解渴。"},{"id":328,"bank":"词条（196页起）","word":"缺少核心技术","def":"企业产品是'组装'的，关键部件全进口，'卡脖子'就停产。"},{"id":329,"bank":"词条（196页起）","word":"研发投入不足","def":"企业研发经费占营收才一个点，无实验室无博士，产品'跟跑'。"},{"id":330,"bank":"词条（196页起）","word":"创业者能力不足","def":"创始人懂技术不懂管理、不懂财务营销，企业'长不大'。"},{"id":331,"bank":"词条（196页起）","word":"创业环境差","def":"市里审批难、融资贵、人才缺，'点子死在摇篮里'。"},{"id":332,"bank":"词条（196页起）","word":"市场销售成本高","def":"产品出厂十元零售五十，中间商赚四十，'生产者不赚、消费者多花'。"},{"id":333,"bank":"词条（196页起）","word":"产品缺乏竞争力","def":"产品'同质高价、同价低质'，客户'不选它'。"},{"id":334,"bank":"词条（196页起）","word":"从业水平低","def":"行业从业者无培训无证，服务'靠运气'，投诉率高。"},{"id":335,"bank":"词条（196页起）","word":"物流体系不完善","def":"村快递只到乡，村民取件跑十里，农产品'出不去'。"},{"id":336,"bank":"词条（196页起）","word":"品牌建设滞后","def":"企业产品不错但不投品牌，'酒香也怕巷子深'，消费者不知道。"},{"id":337,"bank":"词条（196页起）","word":"产业运作模式落后","def":"行业还靠'家庭作坊'，无分工无标准无品牌，'小散弱'。"},{"id":338,"bank":"词条（196页起）","word":"生产效益低","def":"工厂人均产出是行业均值一半，能耗高一倍，'忙而不赚'。"},{"id":339,"bank":"词条（196页起）","word":"附加值低","def":"企业出口原料，别人加工贴牌，'汗水钱'被赚走。"},{"id":340,"bank":"词条（196页起）","word":"重复建设","def":"各县都建一样的园区、一样的项目、一样的产线，'谁都上、谁都过剩'。"},{"id":341,"bank":"词条（196页起）","word":"购买力弱","def":"居民收入低，'不敢花、不能花'，消费品'卖不动'。"},{"id":342,"bank":"词条（196页起）","word":"收益两极化","def":"行业头部赚几十亿，小企业亏损，'富的越富、穷的越穷'。"},{"id":343,"bank":"词条（196页起）","word":"资金流向不明","def":"项目资金'说不清去哪了'，谁用了、用哪了，没人讲得清。"},{"id":344,"bank":"词条（196页起）","word":"投入产出效益低","def":"项目投一亿，年收益五百万，'账算不平'。"},{"id":345,"bank":"词条（196页起）","word":"自筹资金成本较高","def":"企业找民间借款，利息一分五，'银行贷款难、民间借款贵'。"},{"id":346,"bank":"词条（241页起）","word":"具身智能","def":"机器人有'身体'也有'大脑'，能看能听能触能在物理世界行动，不只是'云端聊天'。"},{"id":347,"bank":"词条（241页起）","word":"创新能力强","def":"企业年年出新品，专利行业第一，'别人跟跑它领跑'。"},{"id":348,"bank":"词条（241页起）","word":"智能化","def":"工厂设备会'思考'：感知故障、自调参数、预测维护，机器有了'脑子'。"},{"id":349,"bank":"词条（241页起）","word":"自主创新","def":"企业不买不许可，自己建团队搞研发，'核心技术在自己手里'。"},{"id":350,"bank":"词条（241页起）","word":"自动化","def":"产线从上料到包装不用人手，机器全干，人只'看屏'。"},{"id":351,"bank":"词条（241页起）","word":"首创精神","def":"团队敢做'没人做过的'，首台样机失败百次仍继续，'敢为天下先'。"},{"id":352,"bank":"词条（241页起）","word":"数据化管理","def":"企业用数据决策：生产看看板、销售看热力、库存看趋势，'经验'变'数字'。"},{"id":353,"bank":"词条（241页起）","word":"技术贸易逆差严重","def":"该国技术进口远大于出口，'买多卖少'，年年'交学费'。"},{"id":354,"bank":"词条（241页起）","word":"基础研究能力弱","def":"国家论文多，但'从0到1'的原创成果少，'地基'不牢。"},{"id":355,"bank":"词条（241页起）","word":"装备科技化","def":"农场用北斗导航拖拉机、无人机打药、传感器灌溉，'铁牛'变'智牛'。"},{"id":356,"bank":"词条（241页起）","word":"信息协同创新","def":"企业高校院所共享数据、联合攻关，'你的数据加我的算法等于新成果'。"},{"id":357,"bank":"词条（241页起）","word":"共建平台","def":"三家企业合资建检测中心，设备数据共享，'各建一部分、大家用'。"},{"id":358,"bank":"词条（241页起）","word":"改良技术使质量精良","def":"企业改进工艺，不良率从百分之一降到万分之一，'精良'在细节里。"},{"id":359,"bank":"词条（241页起）","word":"科学素养低","def":"社区老人信'保健品包治百病'，转发'食物相克'谣言，'谣言止于智者'难。"},{"id":360,"bank":"词条（241页起）","word":"科研缺乏创新","def":"实验室课题'跟热点'，论文'换汤不换药'，'从0到1'少。"},{"id":361,"bank":"词条（241页起）","word":"研发投入不足","def":"企业研发预算年年砍，实验室'冷灶'，新品'吃老本'。"},{"id":362,"bank":"词条（241页起）","word":"缺乏品牌难占有市场","def":"产品不错但没名字，进商场'拿不到柜台'，消费者'不认'。"},{"id":363,"bank":"词条（241页起）","word":"创新能力弱","def":"企业产品'十年不变'，专利为零，'别人创新它看'。"},{"id":364,"bank":"词条（241页起）","word":"科研精神缺失","def":"研究者'追帽子追项目'，不坐'冷板凳'，'十年磨一剑'少。"},{"id":365,"bank":"词条（241页起）","word":"成果转化难","def":"高校专利'睡在抽屉'，企业'找不到技术'，'最后一公里'不通。"},{"id":366,"bank":"词条（241页起）","word":"缺少协同创新","def":"企业高校院所'各干各的'，数据不共享设备不开放，'创新孤岛'。"},{"id":367,"bank":"词条（241页起）","word":"信息不对称","def":"卖家知道产品缺陷，买家不知道，'你知道的我不知道'，交易'踩坑'。"},{"id":368,"bank":"词条（241页起）","word":"重经济轻环境","def":"县里只看GDP不看排放，'钱赚了、山秃了、水黑了'。"},{"id":369,"bank":"词条（241页起）","word":"资源优势","def":"县里有锂矿、稀土、石墨，'端着金饭碗'，开发潜力大。"},{"id":370,"bank":"词条（241页起）","word":"林下经济","def":"林子里种菌菇、养土鸡、栽中药材，'不砍树也致富'，'青山'变'金山'。"},{"id":371,"bank":"词条（241页起）","word":"特色产业","def":"县里靠'一碗茶'，从种植到加工到茶旅，'别人抄不走'。"},{"id":372,"bank":"词条（241页起）","word":"建筑垃圾大量存在","def":"拆迁工地渣土堆成山，运输车'多拉快跑'，'废弃物围城'。"},{"id":373,"bank":"词条（241页起）","word":"环境压力大","def":"市里空气质量倒数、河流黑臭，市民'开窗见霾、出门戴口罩'。"},{"id":374,"bank":"词条（241页起）","word":"污染集聚","def":"园区企业排污'叠加'，排放'1加1大于2'。"},{"id":375,"bank":"词条（241页起）","word":"美化环境","def":"社区种花、刷墙、装灯，'老破小'变'网红打卡点'。"},{"id":376,"bank":"词条（241页起）","word":"大气污染严重","def":"市里PM2.5常年超标，'蓝天'是'奢侈品'，呼吸道病人增多。"},{"id":377,"bank":"词条（241页起）","word":"土质恶化","def":"田地土壤板结、酸化、有机质下降，'越种越薄'。"},{"id":378,"bank":"词条（241页起）","word":"固体垃圾","def":"工地渣土、工厂炉渣、家庭旧家具，'固态废弃物'没处去。"},{"id":379,"bank":"词条（241页起）","word":"绿色环保的生活方式","def":"市民坐公交、分垃圾、带购物袋，'低碳'成习惯。"},{"id":380,"bank":"词条（241页起）","word":"农业生态环境日益恶化","def":"田地土壤板结、农药残留超标、地下水污染，'越种越毒'。"},{"id":381,"bank":"词条（241页起）","word":"分类意识淡薄","def":"居民垃圾一袋扔，'分类麻烦'，桶是'摆设'。"},{"id":382,"bank":"词条（241页起）","word":"乱排乱放","def":"企业废水夜里排河、废渣偷倒上山，'没规矩'。"},{"id":383,"bank":"词条（241页起）","word":"生态系统脆弱","def":"湿地萎缩、物种减少，'一点扰动就崩'，恢复难。"},{"id":384,"bank":"词条（241页起）","word":"引进污染企业","def":"县里'捡到篮里都是菜'，接别人不要的企业，'GDP上去了、环境下来了'。"},{"id":385,"bank":"词条（241页起）","word":"生产清洁化","def":"工厂用清洁能源、封闭工艺，'废水废气废渣不出厂'。"},{"id":386,"bank":"词条（241页起）","word":"废弃资源再生利用","def":"旧电池拆锂、旧衣做保温棉，'废物'变'城市矿产'。"},{"id":387,"bank":"词条（241页起）","word":"智能生态检测","def":"湿地装传感器摄像头，AI识鸟种水质，'生态系统做体检'。"},{"id":388,"bank":"词条（241页起）","word":"治理难度大","def":"污染'几十年积累'，涉及多部门，'头痛医头脚痛医脚'不行。"},{"id":389,"bank":"词条（241页起）","word":"条件恶化","def":"村里路泥、水浑、电不稳，'日子越过越难'。"},{"id":390,"bank":"词条（241页起）","word":"威胁河流生态","def":"大坝阻断鱼类洄游，废水毒死水生生物，'河流失去生机'。"},{"id":391,"bank":"词条（241页起）","word":"引发衍生灾害","def":"地震引发滑坡，滑坡堵江成堰塞湖，'灾生灾'。"},{"id":392,"bank":"词条（241页起）","word":"生活垃圾处置不当","def":"小区垃圾乱堆，渗滤液横流，'垃圾围城'。"},{"id":393,"bank":"词条（241页起）","word":"承诺无法兑现","def":"企业承诺'三天到货'，十天没影，'说话不算数'。"},{"id":394,"bank":"词条（241页起）","word":" function norm(s){
  return String(s||'').toLowerCase().replace(/[\s，。、；：？！“”‘’（）《》【】·—－,.:;?!()\[\]'"\-]/g,'');
}
function lev(a,b){
  var m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  var prev=[],cur=[],i,j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    var tmp=prev; prev=cur; cur=tmp;
  }
  return prev[n];
}
function lcsMarks(word, ans){
  // 返回 word 每个字是否在 LCS 中（用于标红缺字）
  var a=word, b=ans, m=a.length, n=b.length, i, j;
  var dp=[];
  for(i=0;i<=m;i++){ dp.push([]); for(j=0;j<=n;j++) dp[i][j]=0; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  var marks=[], pi=m, pj=n;
  for(i=0;i<m;i++) marks.push(false);
  while(pi>0 && pj>0){
    if(a[pi-1]===b[pj-1]){ marks[pi-1]=true; pi--; pj--; }
    else if(dp[pi-1][pj]>=dp[pi][pj-1]) pi--;
    else pj--;
  }
  return marks;
}
function judge(word, ans){
  var w=norm(word), a=norm(ans);
  if(!a) return {verdict:'wrong', sim:0};
  if(a===w) return {verdict:'correct', sim:1};
  var dist=lev(w,a), sim=1-dist/Math.max(w.length,a.length);
  var contain=(w.indexOf(a)>=0||a.indexOf(w)>=0)&&Math.min(w.length,a.length)>=2;
  if(contain||sim>=0.5) return {verdict:'near', sim:sim};
  return {verdict:'wrong', sim:sim};
}

function stdHtml(word, ans, useMarks){
  if(!useMarks) return '<span>'+esc(word)+'</span>';
  var nw=norm(word), marks=lcsMarks(nw, norm(ans)), out='', k=0, i;
  for(i=0;i<word.length;i++){

    if(norm(c)===''){ out+=esc(c); continue; }
    out+='<span class="'+(marks[k]?'ch-ok':'ch-no')+'">'+esc(c)+'</span>'; k++;
  }
  return out;
}

  var html='<div class="verdict">'+esc(label)+'</div>';
  if(ans) html+='<div class="yours">你的答案：'+esc(ans)+'</div>';
  var marks=(verdict==='near');
  html+='<div class="std">标准答案：'+stdHtml(it.word, ans, marks)+'</div>';
  if(verdict==='near') html+='<div class="diffnote">相似度 '+Math.round(sim*100)+'% · 绿色=写对的字，红色=缺字/错字。再写一次巩固。</div>';
  if(verdict==='revealed') html+='<div class="diffnote">已计入生词本，回头复练。</div>';
  if(verdict==='skip') html+='<div class="diffnote">跳过也计入生词本。</div>';
  fb.innerHTML=html;
  fb.className='feedback show '+verdict;
  $('btn-submit').style.display='none';
  $('row-pre').style.display='none';
  $('row-post').style.display='flex';
  $('d-input').disabled=true;
  var n=Object.keys(state.attempts).length;
  $('d-bar').style.width=(n/state.order.length*100)+'%';
  $('d-pos').textContent='第 '+(state.pos+1)+' / '+state.order.length+' 题 · 已批改 '+n;
}
function submit(){
  if(graded) return;
  var ans=$('d-input').value.trim();
  if(!ans){ toast('先默写，再批改'); return; }
  var it=curItem(), r=judge(it.word, ans);
  if(it.id>=1000 && r.verdict!=='correct'){
    var alts=it.word.split(/[、（）]/);
    for(var ai=0;ai<alts.length;ai++){
      if(!alts[ai]) continue;
      var ri=judge(alts[ai], ans);
      if(ri.verdict==='correct'){ r=ri; break; }
      if(ri.verdict==='near' && (r.verdict!=='near' || ri.sim>r.sim)) r=ri;
      else if(ri.verdict==='wrong' && r.verdict==='wrong' && ri.sim>r.sim) r=ri;
    }
  }
  record(it.id, r.verdict, ans, hintUsed);
  graded=true;
  showFeedback(r.verdict, ans, hintUsed, r.sim);
}
function giveHint(){
  if(graded) return;
  hintUsed=true;
  var w=curItem().word;
  var boxes=''; for(var i=1;i<w.length;i++) boxes+='□';
  $('d-hint').innerHTML=esc(w[0])+boxes+'<span class="hintnote">共'+w.length+'字</span>';
  $('btn-hint').disabled=true;
}
function reveal(){
  if(graded) return;
  var it=curItem();
  record(it.id, 'revealed', '', hintUsed);
  graded=true;
  showFeedback('revealed', '', hintUsed, 0);
}
function next(){
  if(!graded){
    var it=curItem();
    record(it.id, 'skip', '', hintUsed);
    toast('已跳过，计入生词本');
  }
  state.pos++; save(); renderDict();
}
function retry(){
  graded=false;
  $('d-input').disabled=false; $('d-input').value='';
  var fb=$('d-feedback'); fb.className='feedback'; fb.innerHTML='';
  $('btn-submit').style.display='block';
  $('row-pre').style.display='flex';
  $('row-post').style.display='none';
  $('d-input').focus();
}
function shuffleRest(){
  var rest=state.order.slice(state.pos);
  for(var i=rest.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)), t=rest[i]; rest[i]=rest[j]; rest[j]=t;
  }
  state.order=state.order.slice(0,state.pos).concat(rest);
  save(); toast('已打乱剩余 '+rest.length+' 题'); renderDict();
}
function showDone(){
  var ok=0,near=0,bad=0,total=state.order.length,wrongIds=[];
  state.order.forEach(function(id){
    var a=state.attempts[id];
    if(!a){ bad++; wrongIds.push(id); return; }
    if(a.verdict==='correct') ok++;
    else if(a.verdict==='near'){ near++; wrongIds.push(id); }
    else { bad++; wrongIds.push(id); }
  });
  $('done-rate').textContent=total?Math.round(ok/total*100)+'%':'--';
  $('done-sub').textContent='本轮 '+total+' 题 · 答对率';
  $('dn-ok').textContent=ok; $('dn-near').textContent=near; $('dn-bad').textContent=bad;
  $('btn-done-wrong').disabled=wrongIds.length===0;
  $('btn-done-wrong').textContent='错词再练一轮（'+wrongIds.length+'）';
  show('done');
}
function renderChips(){
  var html='<button class="chip'+(pvBank==='all'?' on':'')+'" data-bank="all">全部 '+DATA.length+'</button>';
  BANKS.forEach(function(b){
    var n=DATA.filter(function(x){return x.bank===b;}).length;
    var label=b.replace('词条（','').replace('）','');
    html+='<button class="chip'+(pvBank===b?' on':'')+'" data-bank="'+esc(b)+'">'+esc(label)+' '+n+'</button>';
  });
  $('pv-chips').innerHTML=html;
  var chips=$('pv-chips').querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++){
    chips[i].onclick=function(){ pvBank=this.getAttribute('data-bank'); renderChips(); renderPreview(); };
  }
}
function itemCard(x){
  var h=state.history[x.id];
  var badge = x.def ? (h?'<span class="badge '+h.verdict+'">'+VERDICT_LABEL[h.verdict]+'</span>':'<span class="badge none">未练</span>') : '<span class="badge none">待补</span>';
  return '<div class="pv-item"><div class="w">'+esc(x.word)+'</div><div class="d">'+esc(x.def||'原书字迹模糊，待查书补录。')+'</div><div class="meta"><span>'+esc(x.bank)+' · #'+x.id+'</span>'+badge+'</div></div>';
}
function renderPreview(){
  var q=pvQuery.toLowerCase(), list=[];
  DATA.forEach(function(x){
    if(pvBank!=='all' && x.bank!==pvBank) return;
    if(q && x.word.toLowerCase().indexOf(q)<0 && (x.def||'').toLowerCase().indexOf(q)<0) return;
    list.push(x);
  });
  $('pv-count').textContent='共 '+list.length+' 条';
  $('pv-list').innerHTML=list.length?list.map(itemCard).join(''):'<div class="empty">没有匹配的词条</div>';
}
function renderShengci(){
  var ids=shengciIds();
  $('sc-count').textContent='生词本 · '+ids.length+' 条（近似/答错/看答案/跳过）';
  $('btn-sc-drill').disabled=ids.length===0;
  $('sc-list').innerHTML=ids.length?ids.map(function(id){return itemCard(BYID[id]);}).join(''):'<div class="empty">生词本空空如也，很好。</div>';
}
function goHome(){ renderHome(); show('home'); }
function bind(){
  $('btn-dict').onclick=function(){ startRound(VALID.map(function(x){return x.id;}),'main'); };
  $('btn-gd').onclick=function(){ startRound(GD_VALID.map(function(x){return x.id;}),'gd'); toast('材料直接出现规范词时，优先抄原文'); };
  $('btn-preview').onclick=function(){ renderChips(); renderPreview(); show('preview'); };
  $('btn-resume').onclick=function(){ show('dict'); renderDict(); };
  $('btn-sc-home').onclick=function(){ renderShengci(); show('shengci'); };
  $('btn-export-home').onclick=exportCSV;
  $('btn-reset').onclick=function(){
    if(confirm('确定重置全部进度？此操作不可恢复。')){
      state={order:[],pos:0,attempts:{},history:{}}; save(); goHome(); toast('进度已重置');
    }
  };
  $('btn-home-top').onclick=goHome;
  $('btn-pv-back').onclick=goHome;
  $('pv-search').addEventListener('input',function(){ pvQuery=this.value.trim(); renderPreview(); });
  $('btn-submit').onclick=submit;
  $('btn-hint').onclick=giveHint;
  $('btn-reveal').onclick=reveal;
  $('btn-next').onclick=next;
  $('btn-retry').onclick=retry;
  $('btn-shuffle').onclick=shuffleRest;
  $('btn-export-dict').onclick=exportCSV;
  $('btn-sc-dict').onclick=function(){ renderShengci(); show('shengci'); };
  $('btn-home-dict').onclick=goHome;
  $('d-input').addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); if(graded) next(); else submit(); }
  });
  $('btn-sc-back').onclick=goHome;
  $('btn-sc-drill').onclick=function(){ startRound(shengciIds()); };
  $('btn-sc-clear').onclick=function(){
    var ids=shengciIds();
    if(!ids.length) return;
    if(confirm('清空生词本（同时清除这'+ids.length+'条的批改记录）？')){
      ids.forEach(function(id){ delete state.history[id]; });
      save(); renderShengci(); toast('生词本已清空');
    }
  };
  $('btn-done-wrong').onclick=function(){
    var ids=state.order.filter(function(id){ var a=state.attempts[id]; return !a||a.verdict!=='correct'; });
    startRound(ids);
  };
  $('btn-done-again').onclick=function(){ var gd=state.pool==='gd'; startRound((gd?GD_VALID:VALID).map(function(x){return x.id;}), gd?'gd':'main'); };
  $('btn-done-export').onclick=exportCSV;
  $('btn-done-home').onclick=goHome;
}
load(); bind(); goHome();
</script>
</body>
</html>
